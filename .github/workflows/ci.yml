name: CI

on:
  push:
    branches: [main]
    # Obsidian 社区目录校验要求 tag 与 manifest version 精确一致，不能带 v 前缀
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # tsc 在 Windows 下有编码 bug，故 CI 跑在 ubuntu 上（见 docs/DEVELOPMENT.md）
      - name: Type-check
        run: npm run lint

      - name: Unit tests
        if: false   # 临时禁用
        run: npm test

      # 必须用 release 模式，不能用 `npm run build`：
      #   开发模式 → 仓库根 main.js（不压缩 + 内联 sourcemap，会把全部 TS 源码随包发出）
      #   发布模式 → dist/main.js（压缩、无 sourcemap）
      # 发布包契约见 scripts/release.mjs：dist/ 恰好三件套 main.js / manifest.json / styles.css；
      # versions.json 不打包（只留仓库根供社区目录读取，见 release.mjs:11）。
      - name: Build & package (production)
        run: npm run release

      - name: Generate docs
        if: false   # 临时禁用
        run: npm run docs

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: code-converter-release
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

  release:
    name: GitHub Release (on tag)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: code-converter-release
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 社区目录校验要求 tag 与 manifest version 精确一致（不带 v）
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./dist/manifest.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag '$TAG' does not match manifest version '$VER' (tag must not have a v prefix)"
            exit 1
          fi
          echo "tag '$TAG' == manifest version '$VER'"

      # 发布资产必须与 scripts/release.mjs 的契约完全一致：恰好三件套。
      # 少 styles.css → 插件装上后没有样式；多 versions.json → 污染社区目录。
      # 这道闸门让「资产清单漂移」在发版时硬失败，而不是静默发出去。
      - name: Verify release assets complete
        run: |
          set -e
          for f in main.js manifest.json styles.css; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::release asset 'dist/$f' is missing or empty"
              exit 1
            fi
          done
          extra="$(ls dist | grep -vxE 'main\.js|manifest\.json|styles\.css' || true)"
          if [ -n "$extra" ]; then
            echo "::error::unexpected files would be published: $extra"
            exit 1
          fi
          ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          generate_release_notes: true
