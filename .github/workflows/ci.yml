name: CI

on:
  push:
    branches: [main]
    # Obsidian 社区目录校验要求 tag 与 manifest version 精确一致，不能带 v 前缀
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # tsc 在 Windows 下有编码 bug，故 CI 跑在 ubuntu 上（见 docs/DEVELOPMENT.md）
      - name: Type-check
        run: npm run lint

      - name: Unit tests
        if: false   # 临时禁用
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate docs
        if: false   # 临时禁用
        run: npm run docs

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: code-converter-release
          path: |
            main.js
            manifest.json
            versions.json

  release:
    name: GitHub Release (on tag)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: code-converter-release
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 社区目录校验要求 tag 与 manifest version 精确一致（不带 v）
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./dist/manifest.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag '$TAG' does not match manifest version '$VER' (tag must not have a v prefix)"
            exit 1
          fi
          echo "tag '$TAG' == manifest version '$VER'"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/versions.json
          generate_release_notes: true
